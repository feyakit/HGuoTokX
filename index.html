<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101012" />
    <title>HGuoX · 短剧</title>
    <script>
      try {
        // 旧主题仅用于首次升级的首帧；React 启动后会迁移并清理旧键。
        // 上一代品牌前缀拼接得出：源码不留旧名，但老用户的键要读得回来（见 src/legacyKeys.ts）。
        const prev = ["hg", "hubx_"].join("");
        const preference = localStorage.getItem("hguox_theme") ?? localStorage.getItem(prev + "theme") ?? localStorage.getItem("hghub_theme");
        const dark = preference === "dark" || (preference !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (!dark) document.documentElement.classList.add("theme-light");
        document.querySelector('meta[name="theme-color"]').content = dark ? "#121212" : "#eeece7";
      } catch (e) {}
    </script>
    <style>html,body{background:#0A0B14}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
