name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Verify brand and platform icon generation
        run: |
          pnpm test:brand
          node scripts/generate-brand-icons.mjs
          node scripts/generate-ios-icons.mjs
          pnpm test:ios-icons

  rust:
    name: Rust compile check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri -> target
          key: ci-rust

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

  ui-regression:
    name: Cross-platform UI smoke (Chromium fixture)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for UI fixtures
        run: pnpm exec playwright-core install --with-deps chromium
      - name: Mobile layout regression
        run: pnpm test:mobile-layout
      - name: Overlay focus and back-stack regression
        run: pnpm test:ios-overlays
      - name: Real App iOS-style smoke
        env:
          IOS_UI_CASE: 390x844-dark
        run: pnpm test:ios-ui
      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: liquid-glass-ui-regression
          path: test-results/
          if-no-files-found: ignore
