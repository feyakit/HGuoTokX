<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="../../src/index.css"/></head>
<body style="background:var(--p-bg)">
<nav class="ios-mobile-nav" data-over-video="false"><div class="hg-glass"><div class="ios-mobile-nav-items"><span>首页</span></div></div></nav>
<div class="ios-overlay"><div class="ios-dialog"><span>半透明弹层</span></div></div>
<div class="ios-setting-group"><div>内容卡片</div></div>
<div class="player-speed-menu"><button>1.0x</button></div>
<div class="desktop-home-tabs"><button>精选</button></div>
<script type="module">
import { installGlassQuality, getGlassPreference, setGlassPreference } from "../../src/glassQuality.ts";
import { installGlassVideoActivity } from "../../src/glassVideoActivity.ts";
import { assessGlassFrames, measureGlassFrameCadence } from "../../src/glassPerformance.ts";
const supported = ["android","ios","windows","macos","linux"];
const requested = new URLSearchParams(location.search).get("platform");
window.__stopGlass = installGlassQuality(supported.includes(requested) ? requested : "windows");
window.__stopGlassVideo = installGlassVideoActivity();
window.__glass = { getPreference:getGlassPreference, setPreference:setGlassPreference };
window.__glassPerformance = { assess:assessGlassFrames, sample:measureGlassFrameCadence };
</script>
</body></html>
