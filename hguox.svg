<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 256 256" role="img" aria-labelledby="hguox-title hguox-desc">
  <title id="hguox-title">HGuoX · 莫比乌斯流光带</title>
  <desc id="hguox-desc">HGuoX 品牌图标：暗夜画布配暖琥珀与电光紫光晕，莫比乌斯曲线将 H 与 X 自然连为一体。</desc>
  <defs>
    <radialGradient id="s1-bg1" cx="20%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#E87648" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#0A0B14" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="s1-bg2" cx="85%" cy="5%" r="75%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#0A0B14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="s1-flow" x1="0" y1="0.2" x2="1" y2="0.8">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="42%" stop-color="#FFB347"/>
      <stop offset="72%" stop-color="#FF6B57"/>
      <stop offset="100%" stop-color="#7C5CFF"/>
    </linearGradient>
    <linearGradient id="s1-glass" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.88"/>
      <stop offset="50%" stop-color="#C4B5FD" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#9B7BFF" stop-opacity="0.85"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect width="256" height="256" rx="58"/>
    </clipPath>
  </defs>
  <g clip-path="url(#squircle)">
