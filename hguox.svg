    <rect width="256" height="256" fill="url(#s1-bg1)"/>
    <rect width="256" height="256" fill="url(#s1-bg2)"/>
    <rect x="2" y="2" width="252" height="252" rx="56" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>
    <path d="M 118 72 L 118 184 M 118 176 C 118 148, 152 114, 198 72"
          fill="none" stroke="url(#s1-glass)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="60" y1="72" x2="60" y2="184" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round"/>
    <path d="M 60 128 L 98 128 C 114 128, 118 116, 118 96 C 118 74, 138 74, 152 96 L 198 184"
